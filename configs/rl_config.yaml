# GRPO RL hyperparameters — ARCHITECTURE.md §2.5
# Defaults were re-sized after the audit (AUDIT.md H3/H4): a serial HF-generate rollout loop on a
# T4 cannot afford 200 updates x 32 long episodes, so the budget below targets what a Kaggle
# session can actually finish. Scale up only after measuring seconds/update.

policy_checkpoint: checkpoints/sft   # policy initialized from frozen SFT adapter
frozen_sft_baseline: checkpoints/sft # kept as fallback if RL destabilizes (§8.3)

algorithm: grpo

rollout:
  task_pool: data/rl_task_pool.jsonl
  dev_slice: auto             # carve a deterministic held-out dev slice OUT of the pool; never the frozen holdout (§8.2)
  dev_size: 24                # tasks removed from training and used only by the mid-RL gate
  dev_eval_tasks: 12          # tasks scored per gate evaluation (k=1, low temperature)
  dev_temperature: 0.2
  k: 4                        # group size; 8x2 tasks/update costs ~5-8 h/update on a T4
  max_steps: 8                # measured: base submits by step 11 on eval; RL starts from SFT
  max_tokens_per_step: 384    # a tool call + short reasoning; 2048 only wastes generation time
  temperature: 1.0
  wall_seconds: 600           # per test run; CPU limit is aligned to this (Limits.for_tests)

reward:
  # Primary weight dominant; validity secondary; step penalty small (§2.5).
  test_pass: 1.0
  patch_validity: 0.15
  step_penalty: 0.005         # per step taken, discourages runaway tool loops
  no_submit_penalty: 0.1

advantage:
  shaping: gated              # gated = validity/step terms only count in groups where someone resolved the task
  scale_by_std: false         # centre only (Dr. GRPO); std scaling amplified noise in all-fail groups

training:
  learning_rate: 1.0e-5
  batch_tasks: 1              # 2x8 rollouts/update exceeds the 12 h session (§5)
  num_updates: 20
  train_steps_per_episode: 6  # assistant steps per episode used in the loss (the final step always)
  kl_coeff: 0.01              # KL to frozen SFT reference, guards collapse (§8.3)
  max_grad_norm: 1.0
  precision: bfloat16
  seed: 0
  max_wall_hours: 8           # stop + checkpoint before the Kaggle session limit (null = unlimited)

checkpointing:
  output_dir: checkpoints/rl
  save_every_updates: 5       # free-tier sessions have hard limits (§5)
  resume_from: null
  eval_dev_every_updates: 10  # catch flat/negative trend early (§8.2 mid-RL gate)

dev_gate:
  patience: 3                 # stop after this many dev evals without a new best; best adapter -> checkpoints/rl/best
  min_delta: 0.0
