[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma4-coding-agent"
version = "0.1.0"
description = "Gemma-4 coding agent for the Kaggle Developer Agent Competition"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyarrow>=15.0",
]
train = [
    "torch",
    "torchvision",
    "transformers==5.14.1",  # exact: known-good for gemma4_unified + TrainingArguments (warmup_ratio removed in newer)
    "peft==0.21.0",
    "trl==1.14.0",
    "datasets==5.0.1",
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",  # exact: proven 4-bit on this stack; unpinned floated on Kaggle and quant silently skipped
    "kagglehub",
]

[tool.setuptools]
packages = [
    "agent",
    "agent.tools",
    "sandbox",
    "train",
    "train.sft",
    "train.rl",
    "eval",
    "data",
    "data.scripts",
]

[tool.pytest.ini_options]
testpaths = ["sandbox/tests", "agent/tests", "eval/tests", "data/tests", "train/tests", "train/rl/tests"]
addopts = "-q"
